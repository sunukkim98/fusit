[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusit"
version = "0.1.0"
description = "Token-Level Differentially Private Inference for Large Language Models"
readme = "README.md"
keywords = ["differential-privacy", "llm", "text-generation", "privacy", "nlp", "renyi-divergence"]
requires-python = ">=3.8"

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.25.0",
    "accelerate>=0.20.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# fusit.trace's NER backends. Both are imported lazily, so the package installs and the
# cot/att signal sources run without either; only fusit.trace.ner needs them.
#   spacy      -> the default backend. Also needs a model:
#                   python -m spacy download en_core_web_trf
#   presidio   -> the tagger DP-Fusion's appendix A.16 selects (dslim/bert-base-NER).
#                Presidio tokenizes with spaCy, so it needs a model too:
#                   python -m spacy download en_core_web_sm
# spaCy models ship as URLs rather than PyPI names, which is why they are documented here
# instead of listed; fusit.trace.ner raises with these commands when one is missing.
trace = [
    "spacy>=3.4.4,<4.0.0",
]
trace-presidio = [
    "fusit[trace]",
    "presidio-analyzer[transformers]>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=fusit --cov-report=term-missing"
