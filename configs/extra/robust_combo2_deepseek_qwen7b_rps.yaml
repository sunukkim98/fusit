description: >
  Combination 2 (2026-10-08), RPS pass on output/fusit_combo2_deepseek: RPS against DeepSeek-R1-Distill-Qwen-7B (bfloat16,
  as TRACE-RPS runs it) for the original, TRACE@1 and ours (ner_att_vcot95 @ 0.01 / 0.1) with the official budget on
  KV-cached probes (1 x 10,000, the official budget for DeepSeek), then the attack of those four RPS texts. Their judge runs separately in float16
  (robust_combo2_deepseek_qwen7b_rps_judge.yaml) so utility uses the main table's judge precision.
extends: robust_combo2_deepseek_qwen7b.yaml
run:
  rps: true
  rps_model: models/DeepSeek-R1-Distill-Qwen-7B
  rps_kv_cache: true
  # 1 x 10,000 (2026-10-09): rps.py defines no second-restart suffix (defense_init2) for models outside its
  # llama2 / llama2-13b / llama3 branches, so the official code runs DeepSeek for one restart only. The entries
  # finished under 2 x 10,000 are kept where the first restart succeeded or both failed (the second, independent
  # restart from the same initial suffix stands in); the one that succeeded only in the second restart was rerun.
  rps_restarts: 1
  rps_iterations: 10000
  rps_xpriv_conditions: [ner_att_vcot95]
  attack_conditions: [rps]
  # the attack runs in its own process (robust_combo2_deepseek_qwen7b_rps_attack.yaml): loading the attacker right
  # after RPS ran out of GPU memory in combination 3 (2026-10-08)
  skip_attack: true
