extends: robust_combo2_deepseek_qwen7b.yaml
run:
  rps: true
  rps_model: models/DeepSeek-R1-Distill-Qwen-7B
  rps_kv_cache: true
  # 1 x 10,000: rps.py defines no second-restart suffix (defense_init2) for models outside its
  # llama2 / llama2-13b / llama3 branches, so the official code runs DeepSeek for one restart only
  rps_restarts: 1
  rps_iterations: 10000
  rps_xpriv_conditions: [ner_att_vcot95]
  attack_conditions: [rps]
