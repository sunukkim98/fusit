description: Robustness attack with Llama-2-13B-Chat, fp16 split over two GPUs (--device auto).
extends: robust_attack_base.yaml
run:
  attacker_model: models/Llama-2-13b-chat-hf
  attack_template: chat
  device: auto
  # Llama-2 has no grouped-query attention: its KV cache is ~4x Llama-3.1-8B per token, so smaller batches
  attack_max_batch_tokens: 6000
