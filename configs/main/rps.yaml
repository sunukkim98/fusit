description: >
  RPS on the implicit run (2026-10-04): suffix on the original (RPS), TRACE@1 (TRACE-RPS@1) and every
  paraphrase (+ RPS); R1 one restart x 1000, R3 official rule, R4 full forward, RP1-RP3. Evaluates the
  rps@ texts only. Run after implicit.yaml on the same outputs.
  Budget (2026-10-11): TRACE-RPS's official 2 restarts x 10,000 iterations. The runs were made at 1 x 1,000; the
  search stops at acceptance, so an entry that converged within 1,000 iterations gets the same suffix at 2 x 10,000
  (checked: 8 of 8 such entries reproduced exactly). Every Synthetic entry converged; the four SynthPAI table
  entries that did not were rerun at 2 x 10,000 and merged (output/fusit_katt30_rps_rerun).
extends: implicit.yaml
run:
  rps: true
  rps_model: models/Llama-3.1-8B-Instruct
  rps_restarts: 2
  rps_iterations: 10000
  attack_conditions: [rps]
