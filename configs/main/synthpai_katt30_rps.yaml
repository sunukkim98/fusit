description: >
  RPS on the SynthPAI k_att 30 run (2026-10-07), as rps.yaml: suffix on the original, TRACE@1 and the four
  paraphrases (R1 1 x 1000, R3 official, R4 full forward), then the rps@ texts evaluated. Run before
  synthpai_katt30_verifier_levels.yaml on the same output, so RPS covers the main paraphrases only (as the k10 run).
  Budget (2026-10-11): 2 x 10,000, as rps.yaml. The run was made at 1 x 1,000; the four table entries that did not
  converge (VivaciousSpright: original, ours 0.01; PassionPanda: original; RainbowRambler: TRACE@1) were rerun at
  2 x 10,000 and merged into output/fusit_katt30_synthpai (output/fusit_katt30_rps_rerun). The entries that had
  converged reproduce exactly at the larger budget (8 of 8 checked), so the merged records match this config.
extends: synthpai_katt30.yaml
run:
  rps: true
  rps_model: models/Llama-3.1-8B-Instruct
  rps_restarts: 2
  rps_iterations: 10000
  attack_conditions: [rps]
